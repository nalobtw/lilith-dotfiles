# ======================================================================
#  settings.conf — your choices: UI scale, font, wallpaper
# ----------------------------------------------------------------------
#  Lives at ~/.config/lilith-rice/settings.conf. Plain shell assignments.
#  Colours are NOT here: wallust generates them from the wallpaper into colors.conf.
#  After editing run:  lilith-theme   (then restart the session: Super+Shift+Q)
# ======================================================================

# --- UI scale ------------------------------------------------------------
# 1 = native 2560x1440. Fractional values work (1.25, 1.5, 2). Applies to the whole desktop.
scale=1

# --- font (terminal, bar, menus) -------------------------------------------
# Any installed family; change it with the font picker (Super+Shift+T).
font="Gallant Raster Term"
font_size=12

# --- cursor (all cursors are 24 px) ------------------------------------------
# Any installed theme: ls ~/.local/share/icons ; change it with the cursor picker (Super+Shift+C).
cursor="catppuccin-mocha-rosewater-cursors"
cursor_size=24

# --- icon theme (system-wide: GTK apps, Bazaar, file dialogs) ------------------
# Pixora is the main one, Papirus the second; change it with the icon picker (Super+Shift+I).
icons="Pixora"

# --- login screen (Ly) background size, in console cells ---------------------
# 320x90 = a 2560x1440 screen with the standard 8x16 console font. Change if the login
# background looks cropped or too small: check with  stty size  on tty2.
ly_cols=320
ly_rows=90

# --- wallpaper ---------------------------------------------------------------
# Full path to an image; change it with the wallpaper picker (Super+Shift+W). Default: The Voyage of Life: Old Age.
wallpaper="$HOME/Pictures/Wallpapers/The-Voyage-of-Life-Old-Age.png"
