# ======================================================================
#  yazi.toml — yazi: layout, sorting, hidden files, mouse, previews, openers
# ----------------------------------------------------------------------
#  Lives at ~/.config/yazi/yazi.toml (symlink to this file). Colours: theme.toml, generated by
#  lilith-theme from the wallust palette (no icons). Keys: keymap.toml. Plugins: package.toml.
# ======================================================================

[mgr]
ratio          = [1, 3, 4]               # parent | current | preview
sort_by        = "mime"                  # by type
sort_dir_first = true
sort_sensitive = false
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]   # click to select, scroll to move
title_format   = "yazi: {cwd}"

[preview]
wrap         = "no"
tab_size     = 2
max_width    = 1200
max_height   = 1400
image_filter = "triangle"
image_quality = 75

# --- openers: what each file type is opened with ----------------------------
[opener]
edit    = [ { run = 'vis "$@"',       desc = "Vis",      block = true, for = "unix" } ]
image   = [ { run = 'rimg "$@"',      desc = "rimg",     orphan = true, for = "unix" } ]
play    = [ { run = 'mpv "$@"',       desc = "mpv",      orphan = true, for = "unix" } ]
browser = [
	{ run = 'librewolf "$@"', desc = "Librewolf", orphan = true, for = "unix" },
	{ run = 'firefox "$@"',   desc = "Firefox",   orphan = true, for = "unix" },
]
extract = [ { run = 'ouch decompress "$@"', desc = "Extract here (ouch)", block = true, for = "unix" } ]

[open]
prepend_rules = [
	{ mime = "text/*",           use = [ "edit", "browser" ] },
	{ mime = "image/*",          use = [ "image", "browser" ] },
	{ mime = "{audio,video}/*",  use = [ "play", "edit" ] },
	{ name = "*.{html,htm,svg}", use = [ "browser", "edit" ] },
	{ mime = "application/{zip,gzip,x-tar,x-bzip*,x-7z-compressed,x-xz,x-rar,zstd}", use = [ "extract" ] },
]

# --- plugins: previews and fetchers ------------------------------------------
[plugin]
prepend_previewers = [
	# archives: list their contents with ouch
	{ mime = "application/{zip,rar,7z*,tar,gzip,x-tar,x-bzip*,x-xz,zstd}", run = "ouch" },
	# json: coloured with jq (piper runs any command and shows its output)
	{ mime = "application/json", run = 'piper -- jq -C . "$1"' },
]
prepend_fetchers = [
	# git status next to files and folders
	{ id = "git", name = "*",  run = "git" },
	{ id = "git", name = "*/", run = "git" },
]
