# ======================================================================
#  keymap.toml — yazi: extra keys for the plugins (the default keys all stay)
# ----------------------------------------------------------------------
#  Lives at ~/.config/yazi/keymap.toml (symlink to this file). `~` in yazi shows every key.
#  jumplist, merge-paste, rsync-paste and clipboard are installed but not bound here: read
#  ~/.config/yazi/plugins/<name>.yazi/README.md for their keys, then add them below.
# ======================================================================

[mgr]
prepend_keymap = [
	# --- navigation ---------------------------------------------------------
	{ on = "l",       run = "plugin smart-enter",           desc = "Enter a folder, or open the file" },
	{ on = "<Enter>", run = "plugin smart-enter",           desc = "Enter a folder, or open the file" },
	{ on = "F",       run = "plugin smart-filter",          desc = "Filter the list as you type" },
	{ on = "T",       run = "plugin toggle-pane max-preview", desc = "Maximise or restore the preview" },
	{ on = "'",       run = "plugin bunny",                 desc = "Bookmarks (bunny)" },

	# --- files and drives -----------------------------------------------------
	{ on = "p",       run = "plugin smart-paste",           desc = "Paste into the hovered folder, or here" },
	{ on = "M",       run = "plugin mount",                 desc = "Mount, unmount and eject drives" },
	{ on = [ "c", "m" ], run = "plugin chmod",              desc = "Change permissions" },
	{ on = "<C-d>",   run = "plugin diff",                  desc = "Diff the selected file with the hovered one" },
	{ on = ".",       run = "plugin what-size",             desc = "Size of the selection or this folder" },

	# --- applications and archives --------------------------------------------
	{ on = "o",       run = "plugin open-with-cmd -- block", desc = "Open with a command (in this terminal)" },
	{ on = "O",       run = "plugin open-with-cmd",         desc = "Open with a command (detached)" },
	{ on = "C",       run = "plugin ouch",                  desc = "Compress with ouch" },
]
