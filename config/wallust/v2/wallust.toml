# ======================================================================
#  wallust.toml — wallust: colours from the wallpaper (wallust 2.x syntax)
# ----------------------------------------------------------------------
#  Lives at ~/.config/wallust/wallust.toml (copied by `lilith-rice wallust`; the flavour matches
#  your wallust version). `lilith-wall <image>` runs wallust, which writes
#  ~/.config/lilith-rice/colors.conf from templates/colors.conf.
# ======================================================================

backend = "fastresize"     # how colours are read from the image
color_space = "lab"        # how the most prominent ones are chosen
palette = "dark16"         # dark background, 16 colours

[templates]
colors = { src = "colors.conf", dst = "~/.config/lilith-rice/colors.conf" }
