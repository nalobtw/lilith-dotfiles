# ======================================================================
#  mpv.conf — mpv: Wayland, hardware decoding on the Intel GPU
# ----------------------------------------------------------------------
#  Lives at ~/.config/mpv/mpv.conf (symlink to this file). Used by yazi, ani-cli and MovieBox-Tui.
# ======================================================================

vo=gpu
gpu-context=wayland
hwdec=auto-safe          # VA-API on the UHD 620 when it works, software otherwise
keep-open=yes
save-position-on-quit=yes
