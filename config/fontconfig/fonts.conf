<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ======================================================================
      fonts.conf: font families and fallbacks
     ======================================================================
      Lives at ~/.config/fontconfig/fonts.conf (symlink to this file). After edits: fc-cache -f
      Main: Gallant Raster Term, then JetBrains Mono. Emoji: SerenityOS Emoji, Mona Color Emoji,
      Noto Color Emoji. Fallbacks: Noto Sans/Serif/Sans Mono, Symbols, Math, Music, CJK, Unifont.
      The terminal, bar and menus use the font in settings.conf; GTK apps and fallbacks use this file. -->
<fontconfig>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Gallant Raster Term</family>
      <family>JetBrains Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Gallant Raster Term</family>
      <family>JetBrains Mono</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>SerenityOS Emoji</family>
      <family>Mona Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <!-- characters the chosen font lacks fall through this list, in this order -->
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>SerenityOS Emoji</string>
      <string>Mona Color Emoji</string>
      <string>Noto Color Emoji</string>
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols 2</string>
      <string>Noto Sans Math</string>
      <string>Noto Music</string>
      <string>Noto Sans CJK JP</string>
      <string>Unifont</string>
    </edit>
  </match>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
